<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Optimisation E-commerce | EMSI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden border border-gray-100">
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 p-8 text-white text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Simulateur d'Approvisionnement E-commerce</h1>
            <p class="mt-3 text-blue-100 font-medium text-lg">Projet de Programmation Linéaire - EMSI</p>
        </div>

        <div class="p-6 md:p-10 grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="space-y-6">
                <div class="flex items-center space-x-2 border-b border-gray-200 pb-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    <h2 class="text-2xl font-bold text-gray-800">Ressources Disponibles</h2>
                </div>
                
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 shadow-sm transition hover:shadow-md">
                    <label class="block text-sm font-bold text-gray-700 mb-1">💰 Budget (DH)</label>
                    <input type="number" id="budget" value="3000" oninput="calculerOptimisation()" class="w-full rounded-md border-gray-300 shadow-sm border p-3 text-lg font-semibold text-blue-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 shadow-sm transition hover:shadow-md">
                    <label class="block text-sm font-bold text-gray-700 mb-1">📦 Stockage (Volume)</label>
                    <input type="number" id="stockage" value="60" oninput="calculerOptimisation()" class="w-full rounded-md border-gray-300 shadow-sm border p-3 text-lg font-semibold text-blue-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 shadow-sm transition hover:shadow-md">
                    <label class="block text-sm font-bold text-gray-700 mb-1">🛒 Demande Maximum</label>
                    <input type="number" id="demande" value="50" oninput="calculerOptimisation()" class="w-full rounded-md border-gray-300 shadow-sm border p-3 text-lg font-semibold text-blue-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 shadow-sm transition hover:shadow-md">
                    <label class="block text-sm font-bold text-gray-700 mb-1">⏱️ Temps Logistique (Minutes)</label>
                    <input type="number" id="temps" value="300" oninput="calculerOptimisation()" class="w-full rounded-md border-gray-300 shadow-sm border p-3 text-lg font-semibold text-blue-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>
            </div>

            <div class="bg-gray-50 p-8 rounded-xl border border-gray-200 flex flex-col justify-center shadow-inner relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-blue-100 opacity-50"></div>
                
                <h2 class="text-2xl font-bold border-b border-gray-200 pb-3 mb-8 text-center text-gray-800 relative z-10">🎯 Stratégie Optimale</h2>
                
                <div class="space-y-4 relative z-10">
                    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 transform transition duration-300 hover:scale-105" id="box-x1">
                        <span class="font-semibold text-gray-700 text-lg">🎧 Écouteurs :</span>
                        <span id="res-x1" class="text-3xl font-black text-blue-600">0</span>
                    </div>
                    
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border-l-4 border-gray-300 transform transition duration-300" id="box-x2">
                        <span class="font-semibold text-gray-500 text-lg">🔋 Batteries :</span>
                        <span id="res-x2" class="text-3xl font-black text-gray-400">0</span>
                    </div>

                    <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 transform transition duration-300 hover:scale-105" id="box-x3">
                        <span class="font-semibold text-gray-700 text-lg">🔊 Enceintes :</span>
                        <span id="res-x3" class="text-3xl font-black text-blue-600">0</span>
                    </div>
                </div>

                <div class="mt-10 text-center bg-gradient-to-br from-green-50 to-green-100 border border-green-300 p-6 rounded-xl shadow-md relative z-10">
                    <p class="text-sm text-green-700 uppercase tracking-widest font-bold">Profit Net Maximum</p>
                    <p class="text-5xl font-extrabold text-green-700 mt-2 drop-shadow-sm"><span id="res-profit">0</span> <span class="text-3xl">DH</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculerOptimisation() {
            // 1. Récupération dynamique des valeurs saisies
            const budget = parseFloat(document.getElementById('budget').value) || 0;
            const stockage = parseFloat(document.getElementById('stockage').value) || 0;
            const demande = parseFloat(document.getElementById('demande').value) || 0;
            const temps = parseFloat(document.getElementById('temps').value) || 0;

            // Sécurité de calcul (pour éviter que le navigateur ne freeze sur des valeurs géantes)
            if (demande > 300) {
                document.getElementById('res-profit').innerText = "Erreur";
                return;
            }

            let maxProfit = 0;
            let bestX1 = 0, bestX2 = 0, bestX3 = 0;

            // 2. Moteur de résolution (Simplexe simplifié par force brute combinatoire)
            for (let x1 = 0; x1 <= demande; x1++) {
                for (let x2 = 0; x2 <= (demande - x1); x2++) {
                    for (let x3 = 0; x3 <= (demande - x1 - x2); x3++) {
                        
                        // Ressources consommées par cette combinaison
                        let coutBudget = (50 * x1) + (75 * x2) + (100 * x3);
                        let coutStockage = (1 * x1) + (2 * x2) + (3 * x3);
                        let coutTemps = (5 * x1) + (8 * x2) + (12 * x3);

                        // Vérification stricte des contraintes de l'EMSI
                        if (coutBudget <= budget && coutStockage <= stockage && coutTemps <= temps) {
                            
                            // Calcul du profit Z
                            let profit = (70 * x1) + (75 * x2) + (100 * x3);
                            
                            // Mémorisation si c'est le meilleur résultat trouvé
                            if (profit > maxProfit) {
                                maxProfit = profit;
                                bestX1 = x1;
                                bestX2 = x2;
                                bestX3 = x3;
                            }
                        }
                    }
                }
            }

            // 3. Mise à jour instantanée de l'interface graphique
            
            // Écouteurs
            let elemX1 = document.getElementById('res-x1');
            let boxX1 = document.getElementById('box-x1');
            elemX1.innerText = bestX1;
            if (bestX1 === 0) {
                elemX1.className = "text-3xl font-black text-gray-400";
                boxX1.className = "flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border-l-4 border-gray-300 transform transition duration-300";
            } else {
                elemX1.className = "text-3xl font-black text-blue-600";
                boxX1.className = "flex justify-between items-center bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 transform transition duration-300 hover:scale-105";
            }

            // Batteries
            let elemX2 = document.getElementById('res-x2');
            let boxX2 = document.getElementById('box-x2');
            elemX2.innerText = bestX2;
            if (bestX2 === 0) {
                elemX2.className = "text-3xl font-black text-gray-400";
                boxX2.className = "flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border-l-4 border-gray-300 transform transition duration-300";
            } else {
                elemX2.className = "text-3xl font-black text-blue-600";
                boxX2.className = "flex justify-between items-center bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 transform transition duration-300 hover:scale-105";
            }
            
            // Enceintes
            let elemX3 = document.getElementById('res-x3');
            let boxX3 = document.getElementById('box-x3');
            elemX3.innerText = bestX3;
            if (bestX3 === 0) {
                elemX3.className = "text-3xl font-black text-gray-400";
                boxX3.className = "flex justify-between items-center bg-gray-50 p-4 rounded-lg shadow-sm border-l-4 border-gray-300 transform transition duration-300";
            } else {
                elemX3.className = "text-3xl font-black text-blue-600";
                boxX3.className = "flex justify-between items-center bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 transform transition duration-300 hover:scale-105";
            }
            
            // Profit formaté avec des espaces pour les milliers (ex: 3 650)
            document.getElementById('res-profit').innerText = maxProfit.toLocaleString('fr-FR');
        }

        // Exécuter l'algorithme une première fois au chargement de la page
        window.onload = calculerOptimisation;
    </script>
</body>
</html>
